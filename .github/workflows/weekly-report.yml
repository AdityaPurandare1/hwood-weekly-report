name: Weekly Notable Issues Report

on:
  schedule:
    # Tuesday 10am PT — fires both PST (18:00 UTC) and PDT (17:00 UTC); the script's
    # timezone guard ensures only the correct one for the current season actually runs.
    - cron: '0 18 * * 2'
    - cron: '0 17 * * 2'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip writing tab + sending email)'
        type: boolean
        default: false
      week:
        description: 'Backfill a past week (YYYY-MM-DD, any day in that week). Blank = current week.'
        type: string
        default: ''
      send_email:
        description: 'Send the email on a backfill run (normally suppressed)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --omit=dev
      - name: Run pipeline
        env:
          GOOGLE_CLIENT_ID:         ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:     ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:     ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          SLACK_TOKEN:              ${{ secrets.SLACK_TOKEN }}
          GEMINI_API_KEY:           ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY:           ${{ secrets.RESEND_API_KEY }}
          PATI_DM_CHANNEL_ID:       ${{ secrets.PATI_DM_CHANNEL_ID }}
          NOTABLE_ISSUES_SHEET_ID:  ${{ secrets.NOTABLE_ISSUES_SHEET_ID }}
          EMAIL_RECIPIENTS:         ${{ secrets.EMAIL_RECIPIENTS }}
          EMAIL_FROM:               ${{ vars.EMAIL_FROM }}
          EMAIL_REPLY_TO:           ${{ vars.EMAIL_REPLY_TO }}
          SLACK_CHANNEL_BSC:           ${{ vars.SLACK_CHANNEL_BSC }}
          SLACK_CHANNEL_DELILAH_LA:    ${{ vars.SLACK_CHANNEL_DELILAH_LA }}
          SLACK_CHANNEL_DELILAH_MIAMI: ${{ vars.SLACK_CHANNEL_DELILAH_MIAMI }}
          SLACK_CHANNEL_KEYS:          ${{ vars.SLACK_CHANNEL_KEYS }}
          SLACK_CHANNEL_POPPY:         ${{ vars.SLACK_CHANNEL_POPPY }}
          SLACK_CHANNEL_NICE_GUY:      ${{ vars.SLACK_CHANNEL_NICE_GUY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Passed as env, not interpolated into the script body, so a dispatch
          # input can never be parsed as shell.
          INPUT_DRY_RUN:    ${{ inputs.dry_run }}
          INPUT_WEEK:       ${{ inputs.week }}
          INPUT_SEND_EMAIL: ${{ inputs.send_email }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          if [ -n "$INPUT_WEEK" ]; then ARGS+=("--week=$INPUT_WEEK"); fi
          if [ "$INPUT_SEND_EMAIL" = "true" ]; then ARGS+=(--email); fi
          echo "Running with args: ${ARGS[*]:-(none)}"
          node src/index.mjs "${ARGS[@]}"
